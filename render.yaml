services:
  - type: web
    name: roadwatch-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: ROADWATCH_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
